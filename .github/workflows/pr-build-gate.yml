name: PR Build Gate

on:
  workflow_run:
    workflows: ["Test Build"]
    types:
      - completed

jobs:
  handle-failed-build:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure'
    permissions:
      pull-requests: write
    steps:
      - name: Resolve pull request number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          number=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')

          if [[ -z "$number" ]]; then
            echo "Could not resolve a pull request for commit $SHA" >&2
            exit 1
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Comment and close the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq '.state')

          if [[ "$state" != "OPEN" ]]; then
            echo "Pull request #$PR_NUMBER is not open (state: $state); nothing to do."
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "This pull request was automatically closed because the plugin failed to build. See the [build log]($RUN_URL) for details. Fix the issue and reopen this pull request to retry the build."
          gh pr close "$PR_NUMBER" --repo "$REPO"
